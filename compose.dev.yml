services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin123
      DOCKER_INFLUXDB_INIT_ORG: TNO
      DOCKER_INFLUXDB_INIT_BUCKET: nexussim
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-token
    restart: unless-stopped
    networks:
      - nexussim-net

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    depends_on:
      - influxdb
    networks:
      - nexussim-net
     
  nexussim-server:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - influxdb
      - grafana    
    environment:      
        INFLUXDB_V2_URL: http://influxdb:8086
        INFLUXDB_V2_ORG: TNO
        INFLUXDB_V2_TOKEN: my-super-secret-token
        INFLUXDB_V2_BUCKET: nexussim
    networks:
      - nexussim-net
    volumes:
        - ./:/usr/src/

networks:
  nexussim-net:
    driver: bridge
